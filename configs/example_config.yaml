# example_config.yaml
# -------------------
# Configuration template for prototype-guided reranking.
# Copy and adapt to your dataset. Do NOT commit your real paths or API tokens.

dataset:
  name: "my_dataset"
  n_cases: 100
  n_classes: 5

embeddings:
  # Paths to precomputed .npy files (L2-normalised, shape: N x d)
  text: "data/embeddings/text.npy"
  image_meanpool: "data/embeddings/image_meanpool.npy"
  patch_dir: "data/embeddings/patches/"   # one <case_id>.npy per case

metadata:
  file: "data/metadata.csv"
  id_col: "case_id"
  label_col: "label"

fixed_pgr:
  # K here is the number of prototypes per case (H in docs/method_overview.md,
  # not ranking depth). Set by mean patch count; see docs/method_overview.md.
  K: 8
  rerank_top_n: 50  # candidates per query to rerank

adaptive_pgr:
  k_grid: [2, 4, 6, 8, 12]  # candidate prototype counts (H) explored for H* selection
  min_support: 6            # validity threshold on MEAN support: a candidate H is valid
                             # only if n_patches / H >= min_support (average per prototype,
                             # not a guarantee for every individual cluster)
  good_support: 20          # reference patches-per-prototype for normalising support
  near_best_ratio: 0.97     # H* = smallest valid H within this fraction of the best utility
  rerank_top_n: 50
  q_fixed: 0.80     # fixed baseline prototype weight
  rho: 0.50         # blend factor between q_fixed and per-case quality
  tau: 0.05         # softmax temperature for weighted centroid

evaluation:
  exclude_exact_pair: true   # remove self-match from candidates before ranking
  recall_ks: [1, 3, 5, 10]
  mrr_cutoff: 10

output:
  dir: "results/"
